services:
  llama-server:
    # check images at https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "8121:8080"
    volumes:
      - ./translator/models:/models
    gpus: all
    env_file:
      - .env
    command: >
      --model /models/${LLAMA_MODEL}
      --host ${LLAMA_HOST}
      --port ${LLAMA_PORT}
      --n-gpu-layers ${LLAMA_GPU_LAYERS}
      --ctx-size ${LLAMA_CTX_SIZE}
      --flash-attn on

  translator-backend:
    container_name: translator-backend
    build: .
    depends_on:
      turbo-ocr:
        condition: service_healthy
    volumes:
      - .:/app
      # - ./.venv:/app/.venv
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    ports:
      - "8052:8052"
    runtime: nvidia
    gpus: all
    environment:
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=copy
    env_file:
      - .env
    shm_size: '4gb'
    # stdin_open: true
    # tty: true
    # healthcheck:
    #   test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8052/health', timeout=2).read()\""]
    #   interval: 5s
    #   timeout: 10s
    #   retries: 30
    #   start_period: 20s
    # command: [ "/bin/bash" ]

  turbo-ocr:
    image: ghcr.io/aiptimizer/turboocr:v3.5.0
    container_name: turbo-ocr

    runtime: nvidia
    gpus: all

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OCR_MODEL=small
      - DISABLE_LAYOUT=1
      - CLS_ALL_BOXES=1
      - REQUEST_TIMEOUT_MS=60000
      - PIPELINE_POOL_SIZE=1
      - TURBO_OCR_CUDA_GRAPHS=0
      - TRT_DET_WORKSPACE_GB=2
      - TRT_OPT_LEVEL=5

    ports:
      - "9080:8000"
      - "9081:50051"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

    restart: unless-stopped
    volumes:
      - ./turboocr-cache:/home/ocr/.cache/turbo-ocr