  translator-backend:
    container_name: translator-backend
    build: .
    depends_on:
      turbo-ocr:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "8052:8052"
    runtime: nvidia
    gpus: all
    environment:
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=copy
    env_file:
      - .env
    shm_size: '2gb'
    restart: unless-stopped

  turbo-ocr:
    image: ghcr.io/aiptimizer/turboocr:v3.5.0
    container_name: turbo-ocr

    runtime: nvidia
    gpus: all

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OCR_MODEL=small
      - DISABLE_LAYOUT=1
      - CLS_ALL_BOXES=1
      - REQUEST_TIMEOUT_MS=60000
      - PIPELINE_POOL_SIZE=1
      - TURBO_OCR_CUDA_GRAPHS=0
      - TRT_DET_WORKSPACE_GB=2
      - TRT_OPT_LEVEL=5

    ports:
      - "9080:8000"
      - "9081:50051"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

    restart: unless-stopped
    volumes:
      - ./turboocr-cache:/home/ocr/.cache/turbo-ocr

  libretranslate:
    container_name: libretranslate
    image: libretranslate/libretranslate:v1.9.6
    ports:
      - "5000:5000"
    restart: unless-stopped
    runtime: nvidia
    gpus: all
    command:
      - "--load-only"
      - "en,ja,ko,zh,vi"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s