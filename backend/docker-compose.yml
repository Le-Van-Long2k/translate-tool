services:
  llama-server:
    # check images at https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "8121:8080"
    volumes:
      - ./translator/models:/models
    gpus: all
    command: >
      --model /models/Hy-MT2-1.8B-Q8_0.gguf  --host 0.0.0.0  --port 8080  --n-gpu-layers 99  --ctx-size 2048

  translator-backend:
    container_name: translator-backend
    build: .
    volumes:
      - .:/app
      # - ./.venv:/app/.venv
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    ports:
      - "7860:7860"
      - "8052:8052"
    runtime: nvidia
    gpus: all
    environment:
      - PYTHONUNBUFFERED=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - UV_LINK_MODE=copy
    shm_size: '4gb'
    stdin_open: true
    tty: true
    command: [ "/bin/bash" ]

  turbo-ocr:
    image: ghcr.io/aiptimizer/turboocr:v3.5.0
    container_name: turbo-ocr

    runtime: nvidia
    gpus: all

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OCR_MODEL=small
      - DISABLE_LAYOUT=1
      - CLS_ALL_BOXES=1
      - REQUEST_TIMEOUT_MS=60000
      - PIPELINE_POOL_SIZE=1
      - TURBO_OCR_CUDA_GRAPHS=0
      - TRT_DET_WORKSPACE_GB=2
      - TRT_OPT_LEVEL=5

    ports:
      - "9080:8000"
      - "9081:50051"

    restart: unless-stopped
    volumes:
      - ./turboocr-cache:/home/ocr/.cache/turbo-ocr